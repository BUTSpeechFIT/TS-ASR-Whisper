# @package _global_
experiment: dixtral_v7_replicate_8gpus_lora

wandb:
  project: dixtral

model:
  dixtral_base_model: "mistralai/Voxtral-Mini-3B-2507"
  dixtral_load_fddt_from: ${oc.env:SRC_ROOT}/dicow_large_v3
  num_soft_prompts: 0
  ctc_weight: 0.0

training:
  auto_find_batch_size: True
  decode_only: false
  train_dixtral: True
  use_lora: True
  soft_prompt_custom_init: True
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  eval_accumulation_steps: 1
  dataloader_num_workers: 1
  dataloader_prefetch_factor: 1
  dataloader_pin_memory: False
  gradient_accumulation_steps: 4
  gradient_checkpointing: True
  overall_batch_size: null
  remove_timestamps_from_ctc: true
  metric_for_best_model: eval_notsofar1_sdm_dev_set_240825.1_dev1_cutset_cp_wer
  use_fddt_only_n_epochs: 0
  use_fddt_only_n_steps: 0
  save_steps: 1000
  eval_steps: 1000
  eval_strategy: "steps"
  save_total_limit: null
  save_strategy: "steps"
  eval_on_start: False
  load_best_model_at_end: True
  learning_rate: 1e-4
  weight_decay: 0.0
  warmup_steps: 5000
  logging_steps: 5
  generation_max_length: 1000
  early_stopping_patience: -1
  max_steps: 25000
  train_metrics_list: ["cp_wer"]
  eval_metrics_list: ["cp_wer"]
  predict_with_generate: true
  save_visualizations: true
  prefixes_to_preheat: ['additional_self_attention_layer', 'additional_layer', 'audio_tower.fddts', 'audio_tower.initial_fddt', 'soft_prompt']
  n_last_dec_layers_to_unfreeze: 0
  params_to_keep_frozen_keywords:
      - language_model
      - audio_tower.conv1
      - audio_tower.conv2
      - audio_tower.embed_positions
      - ctc_lm_head

data:
  use_timestamps: false
  train_cutsets:
  - /mnt/scratch/tmp/ipoloka/mt_asr_data/manifests//notsofar1/notsofar1_sdm_train_set_240825.1_train_cutset_120s.jsonl.gz
  - /mnt/scratch/tmp/ipoloka/mt_asr_data/manifests//notsofar1/notsofar1_sdm_train_set_240825.1_train_cutset_30s.jsonl.gz
  - /mnt/scratch/tmp/ipoloka/mt_asr_data/manifests//ami/ami-sdm_cutset_train_120s.jsonl.gz
  - /mnt/scratch/tmp/ipoloka/mt_asr_data/manifests//ami/ami-sdm_cutset_train_30s.jsonl.gz
  - /mnt/scratch/tmp/ipoloka/mt_asr_data/manifests//librimix/librimix_cutset_libri2mix_train-clean-100_noisy_30s.jsonl.gz
  dev_cutsets:
    - ${oc.env:MANIFEST_DIR}/notsofar1/notsofar1_sdm_dev_set_240825.1_dev1_cutset.jsonl.gz
  eval_cutsets:
    - ${oc.env:MANIFEST_DIR}/notsofar1/notsofar1_sdm_eval_set_240629.1_eval_small_with_GT_cutset.jsonl.gz
  dataset_weights:
  - 3
  - 1
  - 3
  - 1
  - 1
  train_text_norm: "voxtral"
  dev_text_norm: "voxtral"

aug:
  do_augment: false
  musan_augment_prob: 0.3
  musan_root: /mnt/matylda2/data/MUSAN/musan
  spec_aug_prob: 0.3
  stno_gaussian_noise_prob: 0.75
  stno_gaussian_noise_var: 0.2
  stno_max_segment_length: 50
  stno_min_segment_length: 5
  stno_segment_augment_prob: 0.3
  stno_segment_change_prob: 0.1
