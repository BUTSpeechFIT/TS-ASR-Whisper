# @package _global_
experiment: dixtral_gt_diar_ami_5min

wandb:
  project: dixtral_dec

model:
  dixtral_base_model: "mistralai/Voxtral-Mini-3B-2507"
  dixtral_replace_encoder_from: ${oc.env:SRC_ROOT}/dicow_large_v3
  reinit_from: /mnt/scratch/tmp/ipoloka/tsasr/exp/dixtral_new_norm_enhanced_bsize_from_encoder/checkpoint-18000
  num_soft_prompts: 0
  ctc_weight: 0

training:
  use_lora: True
  decode_only: True
  train_dixtral: True
  per_device_eval_batch_size: 4
  dataloader_num_workers: 1
  dataloader_prefetch_factor: 1
  dataloader_pin_memory: False
  remove_timestamps_from_ctc: true
  generation_max_length: 2000
  train_metrics_list: ["cp_wer"]
  eval_metrics_list: ["cp_wer"]
  predict_with_generate: true
  save_visualizations: true
  generation_num_beams: 1

data:
  use_timestamps: false
  eval_text_norm: "whisper_nsf"
  train_cutsets:
  - ${oc.env:MANIFEST_DIR}/notsofar1/notsofar1_sdm_train_set_240825.1_train_cutset_30s.jsonl.gz
  dev_cutsets:
    - ${oc.env:MANIFEST_DIR}/notsofar1/notsofar1_sdm_eval_set_240629.1_eval_small_with_GT_cutset.jsonl.gz
  eval_cutsets:
    - ${oc.env:MANIFEST_DIR}/notsofar1/notsofar1_sdm_eval_set_240629.1_eval_small_with_GT_cutset.jsonl.gz
    - ${oc.env:MANIFEST_DIR}/ami/ami-sdm_cutset_test_5min.jsonl.gz
    - ${oc.env:MANIFEST_DIR}/librispeechmix/librispeechmix_cutset_test-clean-1mix.jsonl.gz
    - ${oc.env:MANIFEST_DIR}/librispeechmix/librispeechmix_cutset_test-clean-2mix.jsonl.gz
    - ${oc.env:MANIFEST_DIR}/librispeechmix/librispeechmix_cutset_test-clean-3mix.jsonl.gz
    - ${oc.env:MANIFEST_DIR}/mixer6/mixer6-mdm_eval_cuts_ch4.jsonl.gz
  dataset_weights:
    - 1

decoding:
  decoding_ctc_weight: 0.0
